<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Workout Importer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="title">Polar Workout Importer</h1>

    <!-- Status area -->
    <div class="status-area" id="status-area">No workout loaded</div>

    <!-- Loaded Workout Details (shown when WORKOUT_LOADED, CREATING, SUCCESS) -->
    <div class="workout-details" id="workout-details" style="display: none;">
      <div class="detail-row">
        <span class="detail-label">Name:</span>
        <span class="detail-val" id="detail-name">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date:</span>
        <span class="detail-val" id="detail-date">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Phases:</span>
        <span class="detail-val" id="detail-phases">-</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button type="button" class="btn btn-secondary" id="btn-read">
        Read Workout
      </button>
      <button type="button" class="btn btn-primary" id="btn-create" disabled>
        Create in Polar Flow
      </button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
